[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "source-rehearsal"
version = "0.1.0"
description = "Discover public data replacements and rehearse their impact on a report."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pandas>=2.2,<4", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
source-rehearsal = "source_rehearsal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
