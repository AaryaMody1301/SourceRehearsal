name: Checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: source-rehearsal --scenario "Threshold flip" --output reports/demo
      # ponytail: real APIs can be unavailable; keep download checks separate from deterministic CI.
      - name: Check real public publisher downloads
        if: matrix.python == '3.13' && github.event_name == 'push'
        continue-on-error: true
        run: source-rehearsal --check-public-sources --output reports/public-sources
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: npm install -g agent-browser@0.38.2
      - name: Verify rendered offline workflow
        env:
          SERPAPI_API_KEY: ''
        run: |
          mkdir -p reports/browser
          python -m streamlit run app.py --server.headless=true --server.port=8501 --browser.gatherUsageStats=false > reports/browser/server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8501/_stcore/health > /dev/null; then break; fi
            sleep 1
          done
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome)"
          agent-browser open http://127.0.0.1:8501
          agent-browser wait --text "Rehearse replacement"
          agent-browser snapshot -i > reports/browser/baseline.txt
          agent-browser screenshot reports/browser/baseline.png --full
          agent-browser find role button click --name "Rehearse replacement"
          agent-browser wait --text "Changes the report"
          agent-browser eval 'if (document.querySelector("[data-testid=stException]")) throw new Error("Streamlit exception"); if (!document.body.innerText.includes("Highlight flips")) throw new Error("Missing result metrics");'
          agent-browser snapshot -i > reports/browser/result.txt
          agent-browser screenshot reports/browser/result.png --full
          agent-browser errors --json > reports/browser/errors.json
          python -c 'import json; data=json.load(open("reports/browser/errors.json")); assert data["success"] and not data["data"]["errors"], data'
          agent-browser console --json > reports/browser/console.json
          agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: reports/browser/
