name: Checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: source-rehearsal --scenario "Threshold flip" --output reports/demo
      # ponytail: real APIs can be unavailable; keep download checks separate from deterministic CI.
      - name: Check real public publisher downloads
        if: matrix.python == '3.13' && github.event_name == 'push'
        continue-on-error: true
        run: source-rehearsal --check-public-sources --output reports/public-sources
